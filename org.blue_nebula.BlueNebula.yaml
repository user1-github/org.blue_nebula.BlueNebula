id: org.blue_nebula.BlueNebula
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: blue-nebula_linux
rename-appdata-file: blue-nebula.metainfo.xml
rename-desktop-file: blue-nebula.desktop
rename-icon: blue-nebula
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --persist=.blue-nebula
modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_mixer.json

  - name: blue-nebula
    buildsystem: cmake-ninja
    builddir: true
    make-args:
      - -v
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/user1-github/base-1.git
        commit: 5ed212ba162760f90997cea82031e0c581c406ff
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
